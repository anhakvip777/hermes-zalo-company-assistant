name: zalo-platform
label: Zalo Company Assistant
kind: platform
version: 1.1.4
description: >
  Connect one company Zalo personal account to Hermes Agent through an
  authenticated loopback zca-js bridge. Stores allowlisted company-group
  conversations, isolates member DMs, and registers zalo, zalo_history, and
  admin-only zalo_admin tools. zca-js is an unofficial API.
author: cuong

requires_env:
  - name: ZALO_PLUGIN_URL
    description: "Loopback bridge URL, normally http://127.0.0.1:8787"
    prompt: "Zalo bridge URL"
    password: false
  - name: ZALO_PLUGIN_TOKEN
    description: "Bridge token, at least 32 UTF-8 bytes"
    prompt: "Zalo bridge token"
    password: true

optional_env:
  - name: ZALO_ADMIN_WEB_ENABLED
    description: "Enable the embedded loopback admin Web UI"
    prompt: "Enable Zalo admin Web UI"
    password: false
  - name: ZALO_ADMIN_WEB_HOST
    description: "Admin Web bind host; must remain 127.0.0.1"
    prompt: "Admin Web host"
    password: false
  - name: ZALO_ADMIN_WEB_PORT
    description: "Admin Web loopback port; default 8790"
    prompt: "Admin Web port"
    password: false
  - name: ZALO_ADMIN_WEB_PASSWORD_HASH
    description: "Scrypt hash for the shared admin Web password"
    prompt: "Admin Web password hash"
    password: true
  - name: ZALO_ADMIN_WEB_SESSION_SECRET
    description: "Random secret of at least 32 UTF-8 bytes for signing sessions"
    prompt: "Admin Web session secret"
    password: true
  - name: ZALO_ADMIN_WEB_SESSION_TTL_SECONDS
    description: "Admin Web session lifetime in seconds; default 86400"
    prompt: "Admin Web session lifetime"
    password: false
  - name: ZALO_ALLOWED_USERS
    description: "Comma-separated member Zalo IDs; empty is rejected"
    prompt: "Allowed member Zalo IDs"
    password: false
  - name: ZALO_ADMIN_USERS
    description: "Comma-separated admin IDs; each must also be an allowed user"
    prompt: "Administrator Zalo IDs"
    password: false
  - name: ZALO_ALLOWED_GROUPS
    description: "Comma-separated company group IDs; every message in these groups is stored"
    prompt: "Allowed company group IDs"
    password: false
  - name: ZALO_GROUP_MODE
    description: "Must be mention: only an allowed member mention starts Hermes"
    prompt: "Group mode"
    password: false
  - name: ZALO_HISTORY_CONTEXT_MESSAGES
    description: "Recent messages supplied to a turn, maximum 100"
    prompt: "Context message count"
    password: false
  - name: ZALO_MEDIA_MAX_BYTES
    description: "Download cap, maximum 20971520 (20 MiB)"
    prompt: "Media byte cap"
    password: false
  - name: ZALO_HOME_CHANNEL
    description: "Default delivery target as user:<id> or group:<id>"
    prompt: "Home channel"
    password: false
  - name: ZALO_DATA_DIR
    description: "Private bridge state directory"
    prompt: "Zalo data directory"
    password: false
  - name: ZALO_DB_PATH
    description: "SQLite conversation database path"
    prompt: "Conversation database path"
    password: false
  - name: ZALO_MEDIA_DIR
    description: "Stored media directory"
    prompt: "Media directory"
    password: false
  - name: ZALO_CLIMSG_RETENTION_DAYS
    description: "Days to retain msgId to cliMsgId mappings; default 30"
    prompt: "Undo cache retention days"
    password: false
  - name: ZALO_INFO_CACHE_TTL
    description: "Info API cache TTL in seconds; default 600"
    prompt: "Info cache TTL"
    password: false
  - name: ZALO_INFO_MIN_INTERVAL_MS
    description: "Minimum delay between info API calls; default 1500 ms"
    prompt: "Info API minimum interval"
    password: false
